<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4 Attractor Ultra</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background: radial-gradient(circle at top,#070a14,#02030a);
  color:white;
  overflow:hidden;
}

/* PARTICLES */
#particles{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

.p{
  position:absolute;
  width:3px;
  height:3px;
  background:cyan;
  border-radius:50%;
  box-shadow:0 0 10px cyan,0 0 20px magenta;
  animation:float 10s linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh);opacity:0}
  to{transform:translateY(-10vh);opacity:1}
}

/* SCREENS */
.screen{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  transform:scale(1.05);
  transition:.4s;
}

.active{
  display:flex;
  opacity:1;
  transform:scale(1);
}

/* BOX */
.box{
  width:90%;
  max-width:500px;
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:15px;
  border:1px solid rgba(0,255,255,0.2);
  backdrop-filter:blur(10px);
}

/* BUTTON */
.btn{
  padding:12px;
  margin:5px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  background:linear-gradient(90deg,#00ffff,#ff00ff);
  font-weight:bold;
}

/* STEP */
.step{
  margin-top:6px;
  padding:6px;
  border-left:3px solid cyan;
  background:rgba(255,255,255,0.03);
}

/* SHAKE */
.shake{
  animation:shake .3s;
}

@keyframes shake{
  0%{transform:translate(0)}
  25%{transform:translate(-5px,5px)}
  50%{transform:translate(5px,-5px)}
  75%{transform:translate(-3px,3px)}
  100%{transform:translate(0)}
}

/* FLASH */
.flash{
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
  pointer-events:none;
}

.flash.active{
  animation:flash .4s;
}

@keyframes flash{
  0%{opacity:0}
  50%{opacity:.3}
  100%{opacity:0}
}

</style>
</head>

<body>

<div id="particles"></div>
<div id="flash" class="flash"></div>

<!-- SOUNDS -->
<audio id="click" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>
<audio id="win" src="https://actions.google.com/sounds/v1/cartoon/ta_da.ogg"></audio>
<audio id="fail" src="https://actions.google.com/sounds/v1/cartoon/boing.ogg"></audio>

<!-- MENU -->
<div id="menu" class="screen active">
  <h1>🎮 4 ATTRACTOR ULTRA</h1>
  <button class="btn" onclick="go('game')">START</button>
  <button class="btn" onclick="go('challenge')">CHALLENGE</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="box">
    <h2>SIMULATION</h2>
    <input id="num" type="number" placeholder="Enter number">
    <button class="btn" onclick="run(false)">RUN</button>
    <button class="btn" onclick="go('menu')">BACK</button>
    <div id="out"></div>
  </div>
</div>

<!-- CHALLENGE -->
<div id="challenge" class="screen">
  <div class="box">
    <h2>CHALLENGE</h2>
    <input id="cnum" type="number" placeholder="Enter number">
    <button class="btn" onclick="run(true)">START</button>
    <button class="btn" onclick="go('menu')">BACK</button>
    <div id="cout"></div>
  </div>
</div>

<script>

/* SOUND */
function s(id){
  let a=document.getElementById(id);
  a.currentTime=0;
  a.play();
}

/* NAV */
function go(id){
  s("click");
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* PARTICLES */
function particles(){
  let c=document.getElementById("particles");
  for(let i=0;i<35;i++){
    let p=document.createElement("div");
    p.className="p";
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(5+Math.random()*5)+"s";
    c.appendChild(p);
  }
}
particles();

/* WORD SYSTEM */
function w(n){
  const o=["zero","one","two","three","four","five","six","seven","eight","nine"];
  const t=["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const s=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];

  if(n<10)return[o[n]];
  if(n<20)return[t[n-10]];
  if(n<100){
    let a=Math.floor(n/10),b=n%10;
    let r=[s[a]];
    if(b)r.push(o[b]);
    return r;
  }
  return String(n).split("").map(x=>o[+x]);
}

function len(a){return a.reduce((x,y)=>x+y.length,0);}

/* EFFECTS */
function flash(){
  let f=document.getElementById("flash");
  f.classList.add("active");
  setTimeout(()=>f.classList.remove("active"),400);
}

/* CORE */
function run(ch){

  let n=ch?
    parseInt(document.getElementById("cnum").value):
    parseInt(document.getElementById("num").value);

  let out=ch?cout:document.getElementById("out");
  let steps=0;

  out.innerHTML="";

  for(let i=0;i<12;i++){

    let ww=w(n);
    let l=len(ww);

    out.innerHTML+=`<div class="step">${n} → ${ww.join(" + ")} → ${l}</div>`;

    n=l;
    steps++;

    if(n===4){
      s("win");
      flash();
      document.body.classList.add("shake");
      setTimeout(()=>document.body.classList.remove("shake"),300);

      out.innerHTML+=`<div class="step">🔥 REACHED 4</div>`;
      break;
    }
  }

  if(steps>10){
    s("fail");
  }
}

</script>

</body>
</html>
