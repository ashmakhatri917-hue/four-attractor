<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4 Attractor - Final Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  overflow:hidden;
  background:#03040a;
  color:white;
}

/* 🌌 AURORA BACKGROUND */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,255,255,0.18), transparent 55%),
    radial-gradient(circle at 80% 40%, rgba(255,0,255,0.14), transparent 60%),
    radial-gradient(circle at 50% 80%, rgba(0,255,140,0.10), transparent 65%);

  filter: blur(85px) saturate(1.6);
  animation: aurora 14s ease-in-out infinite alternate;
  z-index:-2;
}

@keyframes aurora{
  from{transform:scale(1)}
  to{transform:scale(1.1)}
}

/* 🧊 PANEL */
.panel{
  width:90%;
  max-width:430px;
  margin:60px auto;
  padding:22px;
  border-radius:18px;

  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(25px);

  border:1px solid rgba(255,255,255,0.12);
}

/* 💎 TITLE */
h1{
  font-family:"Great Vibes", cursive;
  font-size:58px;
  text-align:center;

  background:linear-gradient(90deg,#00ffff,#ff00ff,#00ff88);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  filter:drop-shadow(0 0 18px rgba(0,255,255,0.35));
}

/* INPUT */
input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:12px;

  background:rgba(255,255,255,0.05);
  color:white;

  font-family:Orbitron;
}

/* BUTTON */
.btn{
  width:100%;
  padding:14px;
  margin-top:10px;

  border:none;
  border-radius:14px;

  background:rgba(255,255,255,0.04);
  color:white;

  border:1px solid rgba(0,255,255,0.2);

  font-family:Orbitron;

  transition:0.15s;
}

.btn:hover{
  box-shadow:0 0 18px rgba(0,255,255,0.25);
  transform:scale(1.03);
}

.btn:active{
  transform:scale(0.95);
}

/* 📦 OUTPUT STEPS */
.step{
  margin-top:8px;
  padding:10px;

  border-left:3px solid cyan;
  background:rgba(255,255,255,0.03);
  border-radius:10px;

  font-size:14px;
  line-height:1.4;

  font-family:"Inter", sans-serif;

  color:rgba(255,255,255,0.9);
}

/* 💥 SHAKE */
.shake{
  animation: shake 0.075s cubic-bezier(.2,.8,.2,1);
}

@keyframes shake{
  0%{transform:translate(0);}
  20%{transform:translate(-12px,4px);}
  40%{transform:translate(12px,-4px);}
  60%{transform:translate(-6px,2px);}
  80%{transform:translate(6px,-2px);}
  100%{transform:translate(0);}
}

/* 💥 EXPLOSION */
.burst{
  position:fixed;
  width:6px;
  height:6px;
  border-radius:50%;
  background:cyan;
  box-shadow:0 0 25px cyan,0 0 35px magenta;
  animation: explode 0.9s forwards;
}

@keyframes explode{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--x),var(--y)) scale(0.2);opacity:0}
}

.flash{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle,rgba(0,255,255,0.4),transparent);
  animation:flash 0.4s ease-out;
}

@keyframes flash{
  0%{opacity:0}
  40%{opacity:1}
  100%{opacity:0}
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="panel">
  <h1>4 ATTRACTOR</h1>

  <input id="num" type="number" placeholder="Enter number">

  <button class="btn" onclick="boot(); run()">RUN SIMULATION</button>

  <div id="out"></div>
</div>

<!-- AUDIO -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/16/audio_d0a8b7c9c0.mp3">
</audio>

<audio id="tap" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>
<audio id="boss" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>

let unlocked=false;
let musicStarted=false;

/* 🔊 UNLOCK */
function unlock(){
  const a=document.getElementById("tap");
  a.play().then(()=>{
    a.pause();
    a.currentTime=0;
    unlocked=true;
  }).catch(()=>{});
}

function tap(){
  const a=document.getElementById("tap");
  if(!unlocked){unlock();return;}
  a.currentTime=0;
  a.play().catch(()=>{});
}

/* 🎵 MUSIC */
function startMusic(){
  const m=document.getElementById("music");
  if(musicStarted) return;
  m.volume=0.3;
  m.play().catch(()=>{});
  musicStarted=true;
}

/* 🎮 FX */
function shake(){
  document.body.classList.add("shake");
  setTimeout(()=>document.body.classList.remove("shake"),75);
}

function explosion(){
  let f=document.createElement("div");
  f.className="flash";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),400);

  for(let i=0;i<60;i++){
    let p=document.createElement("div");
    p.className="burst";

    let a=Math.random()*Math.PI*2;
    let d=170+Math.random()*140;

    p.style.setProperty("--x",Math.cos(a)*d+"px");
    p.style.setProperty("--y",Math.sin(a)*d+"px");

    p.style.left="50%";
    p.style.top="50%";

    document.body.appendChild(p);
    setTimeout(()=>p.remove(),900);
  }

  shake();
}

/* 🚀 BOOT */
function boot(){
  tap();
  shake();
  startMusic();
}

/* WORD ENGINE */
function w(n){
  const o=["zero","one","two","three","four","five","six","seven","eight","nine"];
  const t=["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const s=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];

  if(n<10)return[o[n]];
  if(n<20)return[t[n-10]];
  if(n<100){
    let a=Math.floor(n/10),b=n%10;
    let r=[s[a]];
    if(b)r.push(o[b]);
    return r;
  }
  return String(n).split("").map(x=>o[+x]);
}

function len(a){
  return a.reduce((x,y)=>x+y.length,0);
}

/* 🎮 CORE */
function run(){

  let n=parseInt(document.getElementById("num").value);
  let out=document.getElementById("out");

  out.innerHTML="";

  for(let i=0;i<12;i++){

    let ww=w(n);
    let l=len(ww);

    out.innerHTML+=`<div class="step">
      🔢 ${n}<br>
      📖 ${ww.join(" + ")}<br>
      🔤 ${l}
    </div>`;

    n=l;

    if(n===4){
      document.getElementById("boss").play().catch(()=>{});
      explosion();

      out.innerHTML+=`<div class="step">🔥 FOUR ATTRACTOR REACHED</div>`;
      break;
    }
  }
}

</script>

</body>
</html>
