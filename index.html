<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>4 Attractor</title>

<style>
body{
  margin:0;
  background:#03040a;
  color:white;
  overflow:hidden;
  font-family:Inter;
}

.panel{
  width:90%;
  max-width:430px;
  margin:40px auto;
  padding:20px;
  background:rgba(255,255,255,0.04);
  border-radius:16px;
}

input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  font-family:Orbitron;
}

button{
  background:#00ffff22;
  color:white;
}

#graph{
  width:100%;
  height:260px;
  margin-top:10px;
  background:rgba(255,255,255,0.03);
  border-radius:12px;
  border:1px solid rgba(0,255,255,0.2);
}
</style>
</head>

<body>

<div class="panel">
  <input id="num" type="number" placeholder="Enter number">
  <button onclick="run()">RUN</button>
  <canvas id="graph" width="400" height="260"></canvas>
</div>

<script>

let dotPositions = [];

function w(n){
  const o=["zero","one","two","three","four","five","six","seven","eight","nine"];
  const t=["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const s=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];

  if(n<10)return[o[n]];
  if(n<20)return[t[n-10]];
  if(n<100){
    let a=Math.floor(n/10),b=n%10;
    let r=[s[a]];
    if(b)r.push(o[b]);
    return r;
  }
  return String(n).split("").map(x=>o[+x]);
}

function len(a){
  return a.reduce((x,y)=>x+y.length,0);
}

function delay(ms){
  return new Promise(r=>setTimeout(r,ms));
}

/* ---------------- GRAPH ---------------- */

function drawGraph(points){

  const canvas = document.getElementById("graph");
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(points.length < 1) return;

  dotPositions = [];

  const W = canvas.width;
  const H = canvas.height;

  const left = 50;
  const right = 20;
  const top = 15;
  const bottom = 35;

  const max = Math.max(...points);

  // axes
  ctx.strokeStyle="rgba(255,255,255,0.4)";
  ctx.beginPath();
  ctx.moveTo(left,top);
  ctx.lineTo(left,H-bottom);
  ctx.lineTo(W-right,H-bottom);
  ctx.stroke();

  // line
  ctx.strokeStyle="cyan";
  ctx.lineWidth=2;
  ctx.beginPath();

  points.forEach((v,i)=>{

    const x = left + i*((W-left-right)/(points.length-1));
    const y = H-bottom - (v/max)*(H-top-bottom);

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);

    dotPositions.push({x,y,step:i,value:v});
  });

  ctx.stroke();

  // dots
  points.forEach((v,i)=>{

    const d = dotPositions[i];

    ctx.fillStyle="cyan";
    ctx.beginPath();
    ctx.arc(d.x,d.y,5,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.font="10px Inter";
    ctx.fillText(v,d.x-8,d.y-8);

    ctx.fillText(i,d.x-3,H-bottom+16);
  });

  // attractor highlight
  if(points[points.length-1]===4){

    const d = dotPositions[points.length-1];

    ctx.fillStyle="#ff00ff";
    ctx.beginPath();
    ctx.arc(d.x,d.y,8,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#00ffff";
    ctx.stroke();
  }
}

/* ---------------- CLICK SYSTEM ---------------- */

const canvas = document.getElementById("graph");

canvas.addEventListener("click",(e)=>{

  const rect = canvas.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  for(let d of dotPositions){

    const dist =
      Math.sqrt((x-d.x)**2 + (y-d.y)**2);

    if(dist < 10){

      if(d.step === dotPositions.length - 1){

        alert(
`📍 Step: ${d.step}
🔢 Number: ${d.value}
🎯 Attractor reached!`
        );

      } else {

        alert(
`📍 Step: ${d.step}
🔢 Number: ${d.value}`
        );
      }

      break;
    }
  }

});

/* ---------------- MAIN ---------------- */

async function run(){

  let n = parseInt(document.getElementById("num").value);
  if(isNaN(n)) return;

  let graphData = [];

  for(let i=0;i<12;i++){

    let ww = w(n);
    let l = len(ww);

    graphData.push(n);

    await delay(500);

    n = l;

    if(n===4){
      graphData.push(4);
      drawGraph(graphData);
      break;
    }
  }

  drawGraph(graphData);
}

</script>

</body>
</html>
