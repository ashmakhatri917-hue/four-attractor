<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<link rel="manifest" href="manifest.json">

<link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>
<defs>
<linearGradient id='g' x1='0' x2='1'>
<stop offset='0%' stop-color='%2300ffff'/>
<stop offset='50%' stop-color='%23ff00ff'/>
<stop offset='100%' stop-color='%2300ff88'/>
</linearGradient>
</defs>
<rect width='512' height='512' rx='120' fill='%2303040a'/>
<circle cx='256' cy='256' r='180' fill='none' stroke='url(%23g)' stroke-width='18'/>
<text x='256' y='330' font-size='250' text-anchor='middle' fill='url(%23g)'>4</text>
</svg>">

<title>4 Attractor</title>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  overflow:hidden;
  background:#03040a;
  color:white;
}
#splash{
  position:fixed;
  inset:0;
  background:#03040a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;

  transition: opacity 0.6s ease;
}
/* 🌌 AURORA BACKGROUND */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,255,255,0.18), transparent 55%),
    radial-gradient(circle at 80% 40%, rgba(255,0,255,0.14), transparent 60%),
    radial-gradient(circle at 50% 80%, rgba(0,255,140,0.10), transparent 65%);

  filter: blur(85px) saturate(1.6);
  animation: aurora 14s ease-in-out infinite alternate;
  z-index:-2;
}

@keyframes aurora{
  from{transform:scale(1)}
  to{transform:scale(1.1)}
}
.step{
  animation:fade 0.4s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
  input:focus{
  outline:none;
  border:1px solid cyan;
  box-shadow:0 0 15px rgba(0,255,255,0.3);
  }
/* 🧊 PANEL */
.panel{
  width:90%;
  max-width:430px;
  margin:60px auto;
  padding:22px;
  border-radius:18px;

  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(25px);

  border:1px solid rgba(255,255,255,0.12);
}

/* 💎 TITLE */
.big-title{
  text-align:center;
  font-family:"Parisienne", cursive;

  margin-top:10px;
  margin-bottom:10px;

  filter:drop-shadow(0 0 25px rgba(0,255,255,0.4));
}
.btn{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(0,255,255,0.3);
  background:linear-gradient(90deg,#00ffff22,#ff00ff22);
  color:white;
  font-family:Orbitron;
  transition:0.2s;
}

.btn:active{
  transform:scale(0.96);
}

.btn{
  position:relative;
  overflow:hidden;
}

.btn::before{
  content:"";
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:linear-gradient(120deg,transparent,rgba(0,255,255,0.2),transparent);
  transform:rotate(25deg);
  animation:shine 3s infinite;
}

@keyframes shine{
  0%{transform:translateX(-100%) rotate(25deg);}
  100%{transform:translateX(100%) rotate(25deg);}
}
  
/* LINE 1 */
.title-line1{
  font-size:56px;
  line-height:1;

  background:linear-gradient(90deg,#00ffff,#ff00ff,#00ff88,#00ffff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* LINE 2 */
.title-line2{
  font-size:44px;
  line-height:1;
  margin-top:4px;

  background:linear-gradient(90deg,#00ffff,#ff00ff,#00ff88,#00ffff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  letter-spacing:1px;
}

/* INPUT */
input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:12px;

  background:rgba(255,255,255,0.05);
  color:white;

  font-family:Orbitron;
}

/* BUTTON */
.btn{
  width:100%;
  padding:14px;
  margin-top:10px;

  border:none;
  border-radius:14px;

  background:rgba(255,255,255,0.04);
  color:white;

  border:1px solid rgba(0,255,255,0.2);

  font-family:Orbitron;
}

/* STEP */
.step{
  margin-top:8px;
  padding:10px;

  border-left:3px solid cyan;
  background:rgba(255,255,255,0.03);
  border-radius:10px;

  font-size:14px;
  line-height:1.4;

  font-family:"Inter", sans-serif;
}

/* SHAKE */
.shake{
  animation: shake 0.075s cubic-bezier(.2,.8,.2,1);
}

@keyframes shake{
  0%{transform:translate(0);}
  50%{transform:translate(10px,-4px);}
  100%{transform:translate(0);}
}

/* EXPLOSION */
.burst{
  position:fixed;
  width:6px;
  height:6px;
  border-radius:50%;
  background:cyan;
  box-shadow:0 0 25px cyan,0 0 35px magenta;
  animation: explode 0.9s forwards;
}

@keyframes explode{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--x),var(--y)) scale(0.2);opacity:0}
}

.flash{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle,rgba(0,255,255,0.4),transparent);
  animation:flash 0.4s ease-out;
}

@keyframes flash{
  0%{opacity:0}
  40%{opacity:1}
  100%{opacity:0}
}
</style>
</head>

<body>
<div id="splash">
  <div class="splash-logo">4 ATTRACTOR</div>
</div>
<div class="bg"></div>

<div class="panel">

  <div class="big-title">
    <div class="title-line1">4</div>
    <div class="title-line2"> Attractor</div>
  </div>

  <input id="num" type="number" placeholder="Enter number">

  <button class="btn" onclick="boot(); run()">RUN SIMULATION</button>

  <div id="out"></div>
</div>

<!-- AUDIO -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/16/audio_d0a8b7c9c0.mp3">
</audio>

<audio id="tap" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>
<audio id="boss" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>

let unlocked=false;
let musicStarted=false;
  
let history = 
  JSON.parse(localStorage.getItem("history") || "[]");
  
window.addEventListener("load", () => {
  setTimeout(() => {
    const s = document.getElementById("splash");
    if (s) {
      s.style.opacity = "0";
      setTimeout(() => s.remove(), 500);
    }

  }, 1200);
});
function unlock(){
  const a=document.getElementById("tap");
  a.play().then(()=>{
    a.pause();
    a.currentTime=0;
    unlocked=true;
  }).catch(()=>{});
}

function tap(){
  const a=document.getElementById("tap");
  if(!unlocked){unlock();return;}
  a.currentTime=0;
  a.play().catch(()=>{});
}

function startMusic(){
  const m=document.getElementById("music");
  if(musicStarted) return;
  m.volume=0.3;
  m.play().catch(()=>{});
  musicStarted=true;
}

function shake(){
  document.body.classList.add("shake");
  setTimeout(()=>document.body.classList.remove("shake"),75);
}

function explosion(){
  let f=document.createElement("div");
  f.className="flash";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),400);

  for(let i=0;i<60;i++){
    let p=document.createElement("div");
    p.className="burst";

    let a=Math.random()*Math.PI*2;
    let d=170+Math.random()*140;

    p.style.setProperty("--x",Math.cos(a)*d+"px");
    p.style.setProperty("--y",Math.sin(a)*d+"px");

    p.style.left="50%";
    p.style.top="50%";

    document.body.appendChild(p);
    setTimeout(()=>p.remove(),900);
  }

  shake();
}

function boot(){
  tap();
  shake();
  startMusic();
}

function w(n){
  const o=["zero","one","two","three","four","five","six","seven","eight","nine"];
  const t=["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const s=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];

  if(n<10)return[o[n]];
  if(n<20)return[t[n-10]];
  if(n<100){
    let a=Math.floor(n/10),b=n%10;
    let r=[s[a]];
    if(b)r.push(o[b]);
    return r;
  }
  return String(n).split("").map(x=>o[+x]);
}

function len(a){
  return a.reduce((x,y)=>x+y.length,0);
}

function delay(ms){
  return new Promise(r=>setTimeout(r,ms));
}
function showHistory(){
  let out=document.getElementById("out");
  out.innerHTML="<div class='step'>📊 HISTORY</div>";

  history.slice(-10).reverse().forEach(h=>{
    out.innerHTML+=`<div class="step">🔢 ${h.input} → ${h.result}</div>`;
  });
}
async function run(){

  let n
    =parseInt(document.getElementById("num").value);
  if (isNaN(n)) return;
  localStorage.setItem("last", n);
  let out=document.getElementById("out");

  out.innerHTML="";

  for(let i=0;i<12;i++){

    let ww=w(n);
    let word=ww.join(" + ");
    let l=len(ww);

    out.innerHTML+=`
      <div class="step">🔢 ${n}</div>
      <div class="step">→ ${word}</div>
      <div class="step">→ letters = ${l}</div>
    `;

    tap(); shake();
    await delay(1000);

  let old = n;

history.push({ input: old, result: l });
localStorage.setItem("history", JSON.stringify(history));
n = l;
    if(n===4){
      document.getElementById("boss").play().catch(()=>{});
      explosion();

      out.innerHTML+=`<div class="step">💥 FOUR ATTRACTOR REACHED</div>`;
      break;
    }
  }
}

</script>

</body>
</html>
