<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4 Attractor Neon Exquisite</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Orbitron;
  color:white;
}

/* 🌈 ULTRA NEON ANIMATED BACKGROUND */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background: linear-gradient(120deg,#00f5ff,#ff00ff,#00ff88,#ffcc00,#00f5ff);
  background-size: 400% 400%;
  animation: gradientMove 8s ease infinite;
  z-index:-3;
  filter: blur(20px) saturate(2);
}

@keyframes gradientMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* 🌌 DARK OVERLAY FOR CONTRAST */
.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background: radial-gradient(circle at top, rgba(0,0,0,0.2), rgba(0,0,0,0.85));
  z-index:-2;
}

/* ✨ FLOATING LIGHTS */
#particles{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

.p{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  animation: float 10s linear infinite;
  box-shadow:0 0 12px currentColor;
}

@keyframes float{
  from{transform:translateY(100vh);opacity:0}
  to{transform:translateY(-10vh);opacity:1}
}

/* 🧊 CENTER SCREEN */
.screen{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

/* 💎 TITLE (CALLIGRAPHY + NEON SHIFT) */
.title{
  font-family:"Great Vibes", cursive;
  font-size:72px;
  text-align:center;

  background: linear-gradient(90deg,#00f5ff,#ff00ff,#00ff88,#ffcc00);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  animation: glowText 3s infinite alternate;
  text-shadow:0 0 25px rgba(255,255,255,0.3);
}

@keyframes glowText{
  from{filter:drop-shadow(0 0 10px cyan)}
  to{filter:drop-shadow(0 0 30px magenta)}
}

/* 🎮 SUB TITLE */
.subtitle{
  font-size:14px;
  opacity:0.8;
  letter-spacing:3px;
  margin-top:-10px;
}

/* 💠 GLASS PANEL */
.panel{
  margin-top:20px;
  padding:18px;
  border-radius:18px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 0 30px rgba(0,255,255,0.2);
  width:90%;
  max-width:450px;
}

/* 🔘 BUTTONS (NEON TAP STYLE) */
.btn{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
  color:white;

  background: linear-gradient(135deg,#00f5ff55,#ff00ff55,#00ff8855);

  box-shadow:0 0 15px rgba(0,255,255,0.3);

  transition:0.2s;
}

.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px cyan,0 0 30px magenta;
}

/* 📦 INPUT */
input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  background:rgba(255,255,255,0.1);
  color:white;
}

/* STEP */
.step{
  margin-top:6px;
  padding:6px;
  border-left:3px solid cyan;
  background:rgba(255,255,255,0.05);
  border-radius:6px;
}

/* 💥 SHAKE */
.shake{
  animation: shake 0.25s;
}

@keyframes shake{
  0%{transform:translate(0)}
  25%{transform:translate(-6px,3px)}
  50%{transform:translate(6px,-3px)}
  100%{transform:translate(0)}
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>
<div id="particles"></div>

<!-- SOUND -->
<audio id="tapSound" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>

<!-- TITLE -->
<div class="screen">

  <div class="title">4 ATTRACTOR</div>
  <div class="subtitle">NEON CALM SIMULATION SYSTEM</div>

  <div class="panel">

    <input id="num" type="number" placeholder="Enter number">

    <button class="btn" onclick="tap(); run()">RUN SIMULATION</button>

    <div id="out"></div>

  </div>
</div>

<script>

/* 🎵 TAP SOUND */
function tap(){
  let a=document.getElementById("tapSound");
  a.currentTime=0;
  a.play().catch(()=>{});
  shake();
}

/* 💥 SHAKE */
function shake(){
  document.body.classList.add("shake");
  setTimeout(()=>document.body.classList.remove("shake"),250);
}

/* 🌈 PARTICLES */
const colors=["cyan","magenta","yellow","lime","white"];

function particles(){
  let c=document.getElementById("particles");
  for(let i=0;i<60;i++){
    let p=document.createElement("div");
    p.className="p";

    let col=colors[Math.floor(Math.random()*colors.length)];
    p.style.color=col;

    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(4+Math.random()*8)+"s";

    c.appendChild(p);
  }
}
particles();

/* WORD SYSTEM */
function w(n){
  const o=["zero","one","two","three","four","five","six","seven","eight","nine"];
  const t=["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const s=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];

  if(n<10)return[o[n]];
  if(n<20)return[t[n-10]];
  if(n<100){
    let a=Math.floor(n/10),b=n%10;
    let r=[s[a]];
    if(b)r.push(o[b]);
    return r;
  }
  return String(n).split("").map(x=>o[+x]);
}

function len(a){return a.reduce((x,y)=>x+y.length,0);}

/* 🎮 CORE */
function run(){

  let n=parseInt(document.getElementById("num").value);
  let out=document.getElementById("out");

  out.innerHTML="";

  for(let i=0;i<12;i++){

    let ww=w(n);
    let l=len(ww);

    out.innerHTML+=`<div class="step">${n} → ${ww.join(" + ")} → ${l}</div>`;

    n=l;

    if(n===4){
      out.innerHTML+=`<div class="step">🔥 REACHED 4</div>`;
      break;
    }
  }
}

</script>

</body>
</html>
