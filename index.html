<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4 Attractor Debug + Sound</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap');

body {
  margin: 0;
  font-family: 'Orbitron', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #0f0c29, #302b63, #24243e);
  color: white;
}

.container {
  width: 92%;
  max-width: 520px;
  background: rgba(255,255,255,0.06);
  border-radius: 20px;
  padding: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 0 40px rgba(0,255,255,0.15);
}

h1 {
  text-align: center;
  text-shadow: 0 0 10px cyan;
}

.sub {
  text-align: center;
  font-size: 12px;
  opacity: 0.7;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  text-align: center;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  background: linear-gradient(90deg, #00ffff, #ff00ff);
  color: black;
  box-shadow: 0 0 15px rgba(0,255,255,0.4);
}

.step {
  margin-top: 12px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(255,255,255,0.06);
  border-left: 4px solid cyan;
}

.words {
  color: #00ffcc;
}

.win {
  margin-top: 10px;
  display: block;
  color: #00ff99;
  font-weight: bold;
  text-shadow: 0 0 10px #00ff99;
}
</style>

</head>

<body>

<div class="container">

<h1>🔬 4 ATTRACTOR SOUND DEBUG</h1>
<div class="sub">Visual + Audio System Simulator</div>

<input id="num" type="number" placeholder="Enter number">
<button onclick="run()">RUN SIMULATION</button>

<div id="result"></div>

</div>

<script>

/* 🔊 SOUND ENGINE */
let audioCtx;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function beep(freq, time=0.12, type="sine") {
  initAudio();

  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.frequency.value = freq;
  osc.type = type;

  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + time);
  osc.stop(audioCtx.currentTime + time);
}

/* SOUND TYPES */
function soundStart() { beep(300); }
function soundStep(i) { beep(200 + i * 30); }
function soundWin() { beep(800, 0.2); setTimeout(()=>beep(1000,0.2),120); }
function soundError() { beep(120,0.3,"square"); }

/* WORD SYSTEM (FIXED RULE) */
function numToWords(n) {
  const ones = ["zero","one","two","three","four","five","six","seven","eight","nine"];
  const teens = ["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const tens = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];

  if (n < 10) return [ones[n]];
  if (n < 20) return [teens[n - 10]];

  if (n < 100) {
    let t = Math.floor(n / 10);
    let o = n % 10;
    let arr = [tens[t]];
    if (o !== 0) arr.push(ones[o]);
    return arr;
  }

  return String(n).split("").map(x => ones[Number(x)]);
}

/* LENGTH */
function getLength(words) {
  let sum = 0;
  for (let w of words) sum += w.length;
  return sum;
}

/* MAIN */
function run() {

  let n = parseInt(document.getElementById("num").value);
  let result = document.getElementById("result");

  if (isNaN(n)) {
    soundError();
    result.innerHTML = "⚠️ Enter a valid number";
    return;
  }

  result.innerHTML = "";
  soundStart();

  for (let i = 0; i < 15; i++) {

    let words = numToWords(n);
    let len = getLength(words);

    let div = document.createElement("div");
    div.className = "step";

    div.innerHTML = `
      🔷 <b>${n}</b><br>
      ${words.join(" + ")}<br>
      Letters: ${words.map(w=>w.length).join(" + ")} → <b>${len}</b>
    `;

    result.appendChild(div);

    soundStep(i);

    n = len;

    if (n === 4) {
      soundWin();
      let win = document.createElement("div");
      win.className = "win";
      win.innerText = "🔥 FOUR ATTRACTOR REACHED!";
      result.appendChild(win);
      break;
    }
  }
}

</script>

</body>
</html>
